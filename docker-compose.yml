services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: jomstudy-app
    working_dir: /var/www/html

    volumes:
      - ./jomstudy-app:/var/www/html
      # Keep Composer dependencies from the image; the source bind mount above
      # would otherwise hide /var/www/html/vendor on the host.
      - vendor-data:/var/www/html/vendor

    environment:
      APP_ENV: production
      APP_DEBUG: "false"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:
      - db

  web:
    image: nginx:1.27-alpine
    container_name: jomstudy-web

    ports:
      - "8000:80"

    volumes:
      - ./jomstudy-app:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: jomstudy-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE:  ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
  vendor-data:
