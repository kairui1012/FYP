  <line class="line" x1="70" y1="560" x2="1730" y2="560"/>
  <text class="small" x="70" y="585">Main flow: User Browser -> React/Inertia UI -> Nginx -> Laravel routes/controllers/AI endpoints -> domain services -> database/storage/cache and DeepSeek/OAuth/mail integrations.</text>
