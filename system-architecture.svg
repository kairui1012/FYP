<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">JomStudy System Architecture</title>
  <desc id="desc">System architecture diagram for the JomStudy Laravel, React, Inertia, MySQL, AI powered learning community platform.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 42px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #475569; }
      .section-title { font: 700 20px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .box-title { font: 700 18px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .box-text { font: 400 14px Arial, Helvetica, sans-serif; fill: #334155; }
      .small { font: 400 13px Arial, Helvetica, sans-serif; fill: #475569; }
      .pill-text { font: 700 13px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .section { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .client { fill: #e0f2fe; stroke: #0284c7; }
      .edge { fill: none; stroke: #64748b; stroke-width: 3; }
      .frontend { fill: #dbeafe; stroke: #2563eb; }
      .backend { fill: #dcfce7; stroke: #16a34a; }
      .domain { fill: #fef9c3; stroke: #ca8a04; }
      .data { fill: #ede9fe; stroke: #7c3aed; }
      .external { fill: #fee2e2; stroke: #dc2626; }
      .deploy { fill: #e2e8f0; stroke: #475569; }
      .box { stroke-width: 2; rx: 14; }
      .tiny-box { stroke-width: 1.5; rx: 999; }
      .line { stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 13 7 L 1 13 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1200"/>
  <text class="title" x="70" y="72">JomStudy System Architecture</text>
  <text class="subtitle" x="72" y="108">AI-powered learning community built with Laravel 12, React, TypeScript, Inertia.js, Docker, and MySQL.</text>

  <rect class="section" filter="url(#shadow)" x="50" y="150" width="320" height="380"/>
  <text class="section-title" x="78" y="190">Client Layer</text>
  <rect class="box client" x="90" y="230" width="240" height="92"/>
  <text class="box-title" x="120" y="264">Users</text>
  <text class="box-text" x="120" y="292">Student / Teacher / Admin</text>
  <text class="box-text" x="120" y="314">Browser-based access</text>
  <rect class="box frontend" x="90" y="365" width="240" height="104"/>
  <text class="box-title" x="120" y="399">React UI</text>
  <text class="box-text" x="120" y="426">Pages, components, hooks</text>
  <text class="box-text" x="120" y="448">Tailwind + Radix + Lucide</text>

  <rect class="section" filter="url(#shadow)" x="430" y="150" width="320" height="380"/>
  <text class="section-title" x="458" y="190">Delivery Layer</text>
  <rect class="box frontend" x="470" y="230" width="240" height="92"/>
  <text class="box-title" x="500" y="264">Inertia.js</text>
  <text class="box-text" x="500" y="292">Server-driven React pages</text>
  <text class="box-text" x="500" y="314">Forms, props, redirects</text>
  <rect class="box deploy" x="470" y="365" width="240" height="104"/>
  <text class="box-title" x="500" y="399">Nginx</text>
  <text class="box-text" x="500" y="426">Docker service: web</text>
  <text class="box-text" x="500" y="448">HTTP / HTTPS entry point</text>

  <rect class="section" filter="url(#shadow)" x="810" y="150" width="480" height="380"/>
  <text class="section-title" x="838" y="190">Laravel Application Layer</text>
  <rect class="box backend" x="850" y="230" width="190" height="92"/>
  <text class="box-title" x="878" y="264">Routes</text>
  <text class="box-text" x="878" y="292">web.php, settings.php</text>
  <text class="box-text" x="878" y="314">callAI.php</text>
  <rect class="box backend" x="1060" y="230" width="190" height="92"/>
  <text class="box-title" x="1088" y="264">Middleware</text>
  <text class="box-text" x="1088" y="292">auth, verified, admin</text>
  <text class="box-text" x="1088" y="314">locale, block checks</text>
  <rect class="box backend" x="850" y="350" width="190" height="82"/>
  <text class="box-title" x="878" y="382">Controllers</text>
  <text class="box-text" x="878" y="410">Posts, comments, admin</text>
  <rect class="box backend" x="1060" y="350" width="190" height="82"/>
  <text class="box-title" x="1088" y="382">Auth</text>
  <text class="box-text" x="1088" y="410">Fortify, 2FA, Socialite</text>
  <rect class="box backend" x="850" y="460" width="400" height="46"/>
  <text class="box-title" x="878" y="490">AI Endpoints: translate, explain, quiz generation, doubt clarify</text>

  <rect class="section" filter="url(#shadow)" x="1350" y="150" width="400" height="380"/>
  <text class="section-title" x="1378" y="190">External Services</text>
  <rect class="box external" x="1430" y="225" width="240" height="82"/>
  <text class="box-title" x="1460" y="257">DeepSeek API</text>
  <text class="box-text" x="1460" y="285">AI translation and learning tools</text>
  <rect class="box external" x="1430" y="345" width="240" height="82"/>
  <text class="box-title" x="1460" y="377">Google OAuth</text>
  <text class="box-text" x="1460" y="405">Social login provider</text>
  <rect class="box external" x="1430" y="465" width="240" height="42"/>
  <text class="box-title" x="1460" y="493">Mail Provider</text>

  <rect class="section" filter="url(#shadow)" x="50" y="600" width="840" height="430"/>
  <text class="section-title" x="78" y="640">Learning Community Domain</text>
  <rect class="box domain" x="90" y="685" width="220" height="112"/>
  <text class="box-title" x="120" y="722">Posts Core</text>
  <text class="box-text" x="120" y="750">Questions, materials, quizzes</text>
  <text class="box-text" x="120" y="772">Content blocks + attachments</text>
  <rect class="box domain" x="350" y="685" width="220" height="112"/>
  <text class="box-title" x="380" y="722">Interactions</text>
  <text class="box-text" x="380" y="750">Comments, votes, likes</text>
  <text class="box-text" x="380" y="772">follows, bookmarks, reports</text>
  <rect class="box domain" x="610" y="685" width="220" height="112"/>
  <text class="box-title" x="640" y="722">Learning Progress</text>
  <text class="box-text" x="640" y="750">Quiz attempts, completions</text>
  <text class="box-text" x="640" y="772">material views, trends</text>
  <rect class="box domain" x="90" y="850" width="220" height="112"/>
  <text class="box-title" x="120" y="887">Gamification</text>
  <text class="box-text" x="120" y="915">Points, badges</text>
  <text class="box-text" x="120" y="937">achievements, leaderboard</text>
  <rect class="box domain" x="350" y="850" width="220" height="112"/>
  <text class="box-title" x="380" y="887">Teacher Tools</text>
  <text class="box-text" x="380" y="915">Material insights</text>
  <text class="box-text" x="380" y="937">certification workflow</text>
  <rect class="box domain" x="610" y="850" width="220" height="112"/>
  <text class="box-title" x="640" y="887">Admin Console</text>
  <text class="box-text" x="640" y="915">User management</text>
  <text class="box-text" x="640" y="937">reports, teacher approvals</text>

  <rect class="section" filter="url(#shadow)" x="950" y="600" width="410" height="430"/>
  <text class="section-title" x="978" y="640">Application Services</text>
  <rect class="box backend" x="990" y="685" width="330" height="74"/>
  <text class="box-title" x="1020" y="716">Post Services</text>
  <text class="box-text" x="1020" y="742">PostQueryBuilder + PostSerializationService</text>
  <rect class="box backend" x="990" y="790" width="330" height="74"/>
  <text class="box-title" x="1020" y="821">Learning Services</text>
  <text class="box-text" x="1020" y="847">ProgressService + LearningProgressService</text>
  <rect class="box backend" x="990" y="895" width="330" height="74"/>
  <text class="box-title" x="1020" y="926">Reward Services</text>
  <text class="box-text" x="1020" y="952">Points, achievements, leaderboard titles</text>

  <rect class="section" filter="url(#shadow)" x="1420" y="600" width="330" height="430"/>
  <text class="section-title" x="1448" y="640">Data Layer</text>
  <rect class="box data" x="1460" y="685" width="250" height="92"/>
  <text class="box-title" x="1490" y="719">MySQL 8.4</text>
  <text class="box-text" x="1490" y="747">Docker service: db</text>
  <text class="box-text" x="1490" y="769">SQLite for local/testing</text>
  <rect class="box data" x="1460" y="815" width="250" height="92"/>
  <text class="box-title" x="1490" y="849">Laravel Storage</text>
  <text class="box-text" x="1490" y="877">Images, attachments</text>
  <text class="box-text" x="1490" y="899">verification documents</text>
  <rect class="box data" x="1460" y="945" width="250" height="52"/>
  <text class="box-title" x="1490" y="978">Cache</text>

  <rect class="section" filter="url(#shadow)" x="50" y="1080" width="1700" height="70"/>
  <text class="section-title" x="78" y="1124">Deployment:</text>
  <rect class="tiny-box deploy" x="210" y="1102" width="210" height="34"/>
  <text class="pill-text" x="242" y="1125">Docker Compose</text>
  <rect class="tiny-box deploy" x="450" y="1102" width="180" height="34"/>
  <text class="pill-text" x="488" y="1125">Nginx web</text>
  <rect class="tiny-box deploy" x="660" y="1102" width="185" height="34"/>
  <text class="pill-text" x="703" y="1125">PHP app</text>
  <rect class="tiny-box deploy" x="875" y="1102" width="180" height="34"/>
  <text class="pill-text" x="915" y="1125">MySQL db</text>
  <rect class="tiny-box deploy" x="1085" y="1102" width="225" height="34"/>
  <text class="pill-text" x="1118" y="1125">Vite asset build</text>
  <rect class="tiny-box deploy" x="1340" y="1102" width="230" height="34"/>
  <text class="pill-text" x="1370" y="1125">Queue worker</text>

