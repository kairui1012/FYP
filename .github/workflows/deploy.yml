name: deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH: ${{ github.ref_name }}
      APP_KEY: ${{ secrets.APP_KEY }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_BRANCH: ${{ env.DEPLOY_BRANCH }}
          APP_KEY: ${{ env.APP_KEY }}
          DB_DATABASE: ${{ env.DB_DATABASE }}
          DB_HOST: ${{ env.DB_HOST }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          DB_PORT: ${{ env.DB_PORT }}
          DB_USERNAME: ${{ env.DB_USERNAME }}
          DEEPSEEK_API_KEY: ${{ env.DEEPSEEK_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ env.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ env.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ env.GOOGLE_REDIRECT_URI }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DEPLOY_BRANCH,APP_KEY,DB_DATABASE,DB_HOST,DB_PASSWORD,DB_PORT,DB_USERNAME,DEEPSEEK_API_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REDIRECT_URI
          script: |
            set -e

            cd /var/www/jomstudy
            git pull --ff-only origin "$DEPLOY_BRANCH"

            cat > /var/www/jomstudy/finalyearproject/.env <<EOF
            APP_NAME=Laravel
            APP_ENV=production
            APP_KEY="$APP_KEY"
            APP_DEBUG=false
            APP_URL=http://localhost

            DB_CONNECTION=mysql
            DB_HOST="$DB_HOST"
            DB_PORT="$DB_PORT"
            DB_DATABASE="$DB_DATABASE"
            DB_USERNAME="$DB_USERNAME"
            DB_PASSWORD="$DB_PASSWORD"

            GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
            GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
            GOOGLE_REDIRECT_URI="$GOOGLE_REDIRECT_URI"

            DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY"
            EOF

            chmod 600 /var/www/jomstudy/finalyearproject/.env

            docker compose run --rm app composer install --no-dev --optimize-autoloader
            docker compose up -d --build
            docker compose exec -T app php artisan migrate --force
