name: deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          envs: APP_KEY,DB_DATABASE,DB_HOST,DB_PASSWORD,DB_PORT,DB_USERNAME,DEEPSEEK_API_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REDIRECT_URI
          script: |
            set -e

            cd /var/www/jomstudy
            git pull --ff-only origin main

            cat > /var/www/jomstudy/finalyearproject/.env <<EOF
            APP_NAME=JomStudy
            APP_ENV=production
            APP_KEY="${{ secrets.APP_KEY }}"
            APP_DEBUG=false
            APP_URL=http://jomstudy.me

            DB_CONNECTION=mysql
            DB_HOST="${{ secrets.DB_HOST }}"
            DB_PORT="${{ secrets.DB_PORT }}"
            DB_DATABASE="${{ secrets.DB_DATABASE }}"
            DB_USERNAME="${{ secrets.DB_USERNAME }}"
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}"

            GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
            GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
            GOOGLE_REDIRECT_URI="${{ secrets.GOOGLE_REDIRECT_URI }}"

            DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}"
            EOF

            chmod 600 /var/www/jomstudy/finalyearproject/.env

            docker compose up -d --build
            docker compose exec -T app php artisan config:clear
            docker compose exec -T app php artisan migrate:fresh --seed --force
            docker compose exec -T app php artisan config:cache